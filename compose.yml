services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: evidence
      POSTGRES_USER: ${EVIDENCE_DB_USER:?Set EVIDENCE_DB_USER}
      POSTGRES_PASSWORD: ${EVIDENCE_DB_PASSWORD:?Set EVIDENCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${EVIDENCE_DB_PORT:-5432}:5432"
    volumes:
      - evidence-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d evidence"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  evidence-postgres:
