services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: evidence
      POSTGRES_USER: ${EVIDENCE_DB_USER:?Set EVIDENCE_DB_USER}
      POSTGRES_PASSWORD: ${EVIDENCE_DB_PASSWORD:?Set EVIDENCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${EVIDENCE_DB_PORT:-5432}:5432"
    volumes:
      - evidence-pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d evidence"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  evidence-pgvector:
