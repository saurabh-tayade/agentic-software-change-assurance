spring:
  datasource:
    url: ${EVIDENCE_DB_URL}
    username: ${EVIDENCE_DB_USER}
    password: ${EVIDENCE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
---
spring:
  config:
    activate:
      on-profile: '!intelligence-api'
  flyway:
    enabled: true
